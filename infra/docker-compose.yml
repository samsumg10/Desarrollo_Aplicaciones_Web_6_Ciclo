name: teleticket

services:

  postgres:
    image: postgres:16-alpine
    container_name: teleticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-teleticket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teleticket}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teleticket} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: teleticket-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-guest}
    ports:
      - "${RABBIT_PORT:-5672}:5672"
      - "${RABBIT_CONSOLA_PORT:-15672}:15672"
    volumes:
      - rabbitmq-datos:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: teleticket-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    environment:
      MH_STORAGE: memory

volumes:
  postgres-datos:
  rabbitmq-datos:
