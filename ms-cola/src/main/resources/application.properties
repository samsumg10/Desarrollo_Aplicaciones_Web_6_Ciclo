# =====================================================================
# ms-cola - Fase 7 (sala de espera, sorteo y pases)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=ms-cola

# Puerto fijo segun la seccion 12.2 del documento de arquitectura.
server.port=8083

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8083/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [ms-cola]

# =====================================================================
# BASE DE DATOS  (plantilla de DEC-01, igual que ms-eventos: solo cambia DB_NAME)
# =====================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_cola}
spring.datasource.username=${DB_USER:teleticket}
spring.datasource.password=${DB_PASSWORD:teleticket}

# JPA: las tablas las crea schema.sql; Hibernate solo valida. Ver ms-eventos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# =====================================================================
# RABBITMQ  (consume evento.publicado, publica turno.habilitado)
# =====================================================================
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s

# Publicar: confirmaciones del broker, y aviso si ninguna cola recibe el mensaje.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumir: el ack se confirma a mano, despues de guardar (ver ms-inventario).
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# =====================================================================
# SALA DE ESPERA  (se pueden cambiar para acelerar las pruebas)
# =====================================================================
# Cuantos turnos se habilitan en cada ciclo de admision. La copia local del evento
# la toma al llegar evento.publicado: cambiarla despues no afecta a eventos ya recibidos.
teleticket.cola.capacidad-por-ciclo=${COLA_CAPACIDAD_POR_CICLO:20}

# Cada cuantos segundos se habilita el siguiente grupo (el diseno dice 10).
teleticket.cola.ciclo-segundos=${COLA_CICLO_SEGUNDOS:10}

# Cuanto vale el pase de compra una vez entregado (el diseno dice 10).
teleticket.cola.pase-minutos=${COLA_PASE_MINUTOS:10}

# El sorteo y la admision son dos tareas programadas: con un solo hilo, una
# admision lenta (por ejemplo, RabbitMQ caido) retrasaria el sorteo a la hora exacta.
spring.task.scheduling.pool.size=2
