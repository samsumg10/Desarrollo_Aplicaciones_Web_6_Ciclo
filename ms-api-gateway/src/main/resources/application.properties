# =====================================================================
# api-gateway - Fase 0 (cimientos)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=api-gateway

# Puerto del unico punto de entrada publico del sistema.
#
# DESVIACION DOCUMENTADA: el diseno (seccion 12.2) asigna el 8080, pero
# en esta maquina ese puerto lo ocupa el contenedor Docker de otro
# proyecto del curso (efsrt-iv-proyecto-app-1). Se usa el 8090 para no
# tener que apagar ese proyecto cada vez que se trabaja en Teleticket.
# El motivo completo esta en docs/fases/FASE-01-infraestructura.md.
server.port=8090

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8090/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [api-gateway]
