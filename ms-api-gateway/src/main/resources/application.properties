# =====================================================================
# api-gateway - Fase 2 (enrutamiento)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=api-gateway

# Puerto del unico punto de entrada publico del sistema.
#
# DESVIACION DOCUMENTADA: el diseno (seccion 12.2) asigna el 8080, pero
# en esta maquina ese puerto lo ocupa el contenedor Docker de otro
# proyecto del curso (efsrt-iv-proyecto-app-1). Se usa el 8090 para no
# tener que apagar ese proyecto cada vez que se trabaja en Teleticket.
# Si en tu maquina tambien esta ocupado, cambialo con GATEWAY_PORT (ver .env.example).
# El motivo completo esta en docs/fases/FASE-01-infraestructura.md.
server.port=${GATEWAY_PORT:8090}

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8090/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [api-gateway]

# =====================================================================
# TABLA DE RUTAS (seccion 4.2 del documento de arquitectura)
# =====================================================================
#
# Cada ruta dice: "lo que llegue a esta direccion, mandalo a este
# microservicio". El cliente solo conoce el puerto 8090.
#
# LO MAS IMPORTANTE DE ESTA TABLA ES LO QUE NO ESTA:
# ms-inventario (8084), ms-pagos (8086) y ms-notificaciones (8088) NO
# tienen ruta. Esa ausencia es una medida de seguridad: sin ruta, nadie
# puede reservar stock ni cobrar desde fuera, asi que no se puede
# saltar la cola. Es parte de la solucion a PRB-03.
# ---------------------------------------------------------------------

# --- ms-usuarios :8081 --- registro y perfil (CU-01)
spring.cloud.gateway.server.webmvc.routes[0].id=ms-usuarios
spring.cloud.gateway.server.webmvc.routes[0].uri=${MS_USUARIOS_URL:http://localhost:${MS_USUARIOS_PORT:8081}}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/usuarios/**

# --- ms-eventos :8082 --- catalogo, zonas y reglas de venta (CU-02, 14, 15)
spring.cloud.gateway.server.webmvc.routes[1].id=ms-eventos
spring.cloud.gateway.server.webmvc.routes[1].uri=${MS_EVENTOS_URL:http://localhost:${MS_EVENTOS_PORT:8082}}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/eventos/**

# --- ms-cola :8083 --- sala de espera y pases de compra (CU-03, CU-04)
spring.cloud.gateway.server.webmvc.routes[2].id=ms-cola
spring.cloud.gateway.server.webmvc.routes[2].uri=${MS_COLA_URL:http://localhost:${MS_COLA_PORT:8083}}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/cola/**

# --- ms-ordenes :8085 --- ordenes y pago (CU-05, CU-06)
spring.cloud.gateway.server.webmvc.routes[3].id=ms-ordenes
spring.cloud.gateway.server.webmvc.routes[3].uri=${MS_ORDENES_URL:http://localhost:${MS_ORDENES_PORT:8085}}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/ordenes/**

# --- ms-tickets :8087 --- e-tickets, nominacion y validacion (CU-07..11)
spring.cloud.gateway.server.webmvc.routes[4].id=ms-tickets
spring.cloud.gateway.server.webmvc.routes[4].uri=${MS_TICKETS_URL:http://localhost:${MS_TICKETS_PORT:8087}}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/tickets/**

# ---------------------------------------------------------------------
# CORS: desde que dominios puede llamar el navegador.
# Mientras no exista el front (fase 18) esto no se usa, pero dejarlo
# configurado evita el clasico error de CORS cuando llegue.
# ---------------------------------------------------------------------
teleticket.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173,http://localhost:4200}
