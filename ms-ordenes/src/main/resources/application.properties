# =====================================================================
# ms-ordenes - Fase 10 (orden con Feign, pago y emision)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=ms-ordenes

# Puerto fijo segun la seccion 12.2 del documento de arquitectura.
server.port=8085

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8085/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [ms-ordenes]

# =====================================================================
# BASE DE DATOS  (plantilla de DEC-01, igual que ms-eventos: solo cambia DB_NAME)
# =====================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_ordenes}
spring.datasource.username=${DB_USER:teleticket}
spring.datasource.password=${DB_PASSWORD:teleticket}

# JPA: las tablas las crea schema.sql; Hibernate solo valida. Ver ms-eventos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# =====================================================================
# RABBITMQ  (fase 9: ms-ordenes publica orden.pagada)
# =====================================================================
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s

# Publisher confirms y returns: los exige PublicadorRabbitMQ (libs/mensajeria-comun).
# Sin ellos un orden.pagada podria perderse sin que nadie se entere. Ver ms-eventos.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Fase 10: ms-ordenes tambien CONSUME (tickets.emitidos). Ack MANUAL: el listener confirma el mensaje
# solo despues de guardar en la base de datos; si el servicio se cae antes, RabbitMQ lo devuelve a la cola.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# =====================================================================
# FEIGN: a quien llama ms-ordenes
# =====================================================================
# Direcciones por variable de entorno, con el puerto directo por defecto. En Docker
# (fase 15) basta con pasar MS_COLA_URL=http://ms-cola:8083, etc. Son las mismas
# variables que usa el gateway.
servicios.cola.url=${MS_COLA_URL:http://localhost:8083}
servicios.eventos.url=${MS_EVENTOS_URL:http://localhost:8082}
servicios.inventario.url=${MS_INVENTARIO_URL:http://localhost:8084}
servicios.pagos.url=${MS_PAGOS_URL:http://localhost:8086}

# Timeouts: un servicio caido o lento no puede dejar al comprador esperando.
#   connect-timeout  cuanto se espera para ABRIR la conexion (un servicio apagado falla casi al instante)
#   read-timeout     cuanto se espera la RESPUESTA una vez conectado
# En el peor caso (conecta y no responde) una llamada tarda 3 s; la orden hace 3 llamadas
# como maximo, y solo una puede colgarse porque la primera que falla corta el proceso.
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=3000
