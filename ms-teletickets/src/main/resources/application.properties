# =====================================================================
# ms-tickets - Fase 0 (cimientos)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=ms-tickets

# Puerto fijo segun la seccion 12.2 del documento de arquitectura.
server.port=8087

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8087/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [ms-tickets]

# =====================================================================
# BASE DE DATOS  (plantilla de DEC-01, igual que ms-eventos: solo cambia DB_NAME)
# =====================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_tickets}
spring.datasource.username=${DB_USER:teleticket}
spring.datasource.password=${DB_PASSWORD:teleticket}

# JPA: las tablas las crea schema.sql; Hibernate solo valida. Ver ms-eventos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# =====================================================================
# RABBITMQ  (fase 10: consume orden.pagada y publica tickets.emitidos)
# =====================================================================
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s

# Publisher confirms y returns: los exige PublicadorRabbitMQ (libs/mensajeria-comun).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Ack MANUAL: el listener confirma orden.pagada solo cuando las entradas ya estan
# guardadas y anunciadas. Si el servicio se cae antes, RabbitMQ devuelve el mensaje.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10

# =====================================================================
# FEIGN: a quien llama ms-tickets (misma variable que usan el gateway y ms-ordenes)
# =====================================================================
servicios.eventos.url=${MS_EVENTOS_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# =====================================================================
# EMISION DE ENTRADAS
# =====================================================================
# Clave secreta del HMAC-SHA256 con que se firma cada entrada:
#   firma = HMAC-SHA256(codigo + eventoId, clave)
# Quien la conozca puede fabricar entradas validas: en produccion se pasa por la
# variable TICKETS_CLAVE_FIRMA y NO se sube a Git. El valor por defecto es solo
# para desarrollo. El servicio no arranca si mide menos de 32 caracteres.
teleticket.tickets.clave-firma=${TICKETS_CLAVE_FIRMA:clave-de-desarrollo-teleticket-no-usar-en-produccion}

# Si la emision falla se reintenta 3 veces, esperando 1 s, 2 s y 4 s (la espera se duplica).
# Agotados los reintentos, el mensaje va a tickets.orden-pagada.dlq y la saga (fase 11) reembolsa la orden.
teleticket.tickets.reintentos=3
teleticket.tickets.espera-inicial-ms=1000

# INTERRUPTOR DE LA DEMO (fase 11): con true la emision falla a proposito despues de guardar las entradas,
# para poder mostrar la saga de reembolso. Debe estar en false: es solo para demostrarla.
teleticket.tickets.simular-fallo-emision=${TICKETS_SIMULAR_FALLO:false}
