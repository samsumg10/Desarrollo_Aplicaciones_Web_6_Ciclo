# ms-usuarios - Fase 4 (registro y roles)
spring.application.name=ms-usuarios
server.port=8081

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.pattern.level=%5p [ms-usuarios]

# Conexion: plantilla de DEC-01 (cambia solo DB_NAME). Valores por defecto = desarrollo local.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_usuarios}
spring.datasource.username=${DB_USER:teleticket}
spring.datasource.password=${DB_PASSWORD:teleticket}

# Las tablas las crea schema.sql ANTES de que Hibernate valide (defer=false).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# Siembra 6 usuarios de prueba si la tabla esta vacia (ids 0000...0001 a 0006).
# Poner en false para un entorno real.
teleticket.usuarios.sembrar-datos=${SEMBRAR_USUARIOS:true}
