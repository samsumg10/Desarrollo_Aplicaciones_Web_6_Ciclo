# =====================================================================
# ms-eventos - Fase 0 (cimientos)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=ms-eventos

# Puerto fijo segun la seccion 12.2 del documento de arquitectura.
server.port=8082

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8082/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [ms-eventos]
