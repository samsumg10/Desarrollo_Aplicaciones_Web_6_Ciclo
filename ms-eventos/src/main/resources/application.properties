# =====================================================================
# ms-eventos - Fase 3 (catalogo de eventos y zonas)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=ms-eventos

# Puerto fijo segun la seccion 12.2 del documento de arquitectura.
server.port=${MS_EVENTOS_PORT:8082}

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8082/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [ms-eventos]

# =====================================================================
# BASE DE DATOS  (plantilla de DEC-01: la copian los demas servicios
#                 cambiando solo DB_NAME)
# =====================================================================
#
# Lo que va despues de los dos puntos es el VALOR POR DEFECTO: si no hay
# variable de entorno, usa ese. Por eso funciona desde Eclipse sin
# configurar nada, y en Docker basta con pasarle DB_HOST y DB_PORT.
#
#   Desde Eclipse          -> localhost:5433  (el PostgreSQL de Docker)
#   Como contenedor (f.15) -> postgres:5432   (dentro de la red de Docker)
#
# El 5433 y no el 5432 porque esta maquina ya tiene un PostgreSQL
# instalado. Ver docs/decisiones/DEC-01-bases-de-datos.md
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_eventos}
spring.datasource.username=${DB_USER:teleticket}
spring.datasource.password=${DB_PASSWORD:teleticket}

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# 'validate' = Hibernate NO crea ni modifica tablas, solo comprueba que
# las que existen coincidan con las entidades Java. Las tablas las crea
# schema.sql. Asi el esquema esta en un sitio y es revisable.
spring.jpa.hibernate.ddl-auto=validate

# Muestra en el log el SQL que ejecuta. Muy util para aprender y depurar;
# en produccion se apagaria.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nombres de tabla y columna tal cual se declaran (evento, inicio_venta),
# sin que Hibernate los transforme.
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ---------------------------------------------------------------------
# schema.sql: crea las tablas al arrancar.
# 'always' lo ejecuta siempre, y el script usa CREATE TABLE IF NOT EXISTS
# para que repetirlo no falle ni borre datos.
# ---------------------------------------------------------------------
spring.sql.init.mode=always

# OJO con esta propiedad, es facil entenderla al reves:
#
#   false (lo que queremos) -> schema.sql se ejecuta ANTES de que Hibernate
#                              valide. Las tablas ya existen cuando valida.
#   true                    -> schema.sql se ejecuta DESPUES. Sirve cuando es
#                              Hibernate quien crea las tablas (ddl-auto=create)
#                              y data.sql solo inserta datos.
#
# Aqui las tablas las crea schema.sql, asi que tiene que ir false. Con true,
# el arranque falla con "Schema validation: missing table [evento]".
spring.jpa.defer-datasource-initialization=false

# =====================================================================
# RABBITMQ  (fase 5)
# =====================================================================
#
# Misma idea que la base de datos: el valor tras los dos puntos es el
# defecto para Eclipse, y en Docker (fase 15) basta con pasar RABBIT_HOST.
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

# Si RabbitMQ esta caido, /publicar debe fallar en segundos y no en el
# minuto que tarda el defecto. Solo falla /publicar: lo demas no lo usa.
spring.rabbitmq.connection-timeout=3s

# Publisher confirms: el broker responde "lo recibi" a cada mensaje. Sin esto
# un mensaje podria perderse sin que nadie se entere. Lo usa PublicadorRabbitMQ.
spring.rabbitmq.publisher-confirm-type=correlated

# Si el exchange no tiene ninguna cola enlazada a la routing key, el broker
# descartaria el mensaje en silencio. Con esto se devuelve y el publicador falla.
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ---------------------------------------------------------------------
# Fechas: se usa Instant en las entidades y los DTO, que Jackson 3
# serializa como ISO-8601 UTC por defecto (2026-12-20T20:00:00Z).
#
# NO hace falta configurar nada. Y cuidado con lo que dicen muchos
# tutoriales: 'spring.jackson.serialization.write-dates-as-timestamps'
# NO existe en Spring Boot 4, porque trae Jackson 3 (tools.jackson) y
# alli esa opcion salio de SerializationFeature. Si la pones, el
# servicio no arranca.
# ---------------------------------------------------------------------
