# =====================================================================
# ms-inventario - Fase 6 (stock y reservas)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=ms-inventario

# Puerto fijo segun la seccion 12.2 del documento de arquitectura.
server.port=8084

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8084/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [ms-inventario]

# =====================================================================
# BASE DE DATOS  (plantilla de DEC-01, igual que ms-eventos: solo cambia DB_NAME)
# =====================================================================
#   Desde Eclipse          -> localhost:5433  (el PostgreSQL de Docker)
#   Como contenedor (f.15) -> postgres:5432
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_inventario}
spring.datasource.username=${DB_USER:teleticket}
spring.datasource.password=${DB_PASSWORD:teleticket}

# ---------------------------------------------------------------------
# JPA / Hibernate: las tablas las crea schema.sql; Hibernate solo valida.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# schema.sql se ejecuta siempre (usa CREATE TABLE IF NOT EXISTS) y ANTES de
# que Hibernate valide. Tiene que ir en false: con true se ejecutaria despues
# y el arranque fallaria con "missing table". Ver application.properties de
# ms-eventos.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# =====================================================================
# RABBITMQ  (fase 6: primer consumidor)
# =====================================================================
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s

# Confirmacion MANUAL del ack: el listener confirma el mensaje solo DESPUES de
# guardar en la base de datos. Con 'auto' (el defecto), Spring lo confirmaria al
# salir del metodo aunque algo hubiera fallado a medias, y el mensaje se perderia.
# Si el servicio se cae antes del ack, RabbitMQ devuelve el mensaje a la cola.
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Mensajes que RabbitMQ entrega por adelantado a este consumidor sin esperar su ack.
spring.rabbitmq.listener.simple.prefetch=10
