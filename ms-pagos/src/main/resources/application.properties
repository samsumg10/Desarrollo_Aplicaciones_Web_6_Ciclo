# =====================================================================
# ms-pagos - Fase 9 (cobros idempotentes)
# =====================================================================

# Identidad del servicio. Desde la fase 8 este nombre lo usan los
# clientes Feign, y mas adelante Eureka.
spring.application.name=ms-pagos

# Puerto fijo segun la seccion 12.2 del documento de arquitectura.
server.port=8086

# ---------------------------------------------------------------------
# Actuator: expone http://localhost:8086/actuator/health
# Sirve para comprobar que el servicio esta vivo, y desde la fase 15
# lo usa el healthcheck de Docker.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# Logs: muestra el nombre del servicio en cada linea, para no
# confundirse al tener 9 ventanas abiertas a la vez.
# ---------------------------------------------------------------------
logging.pattern.level=%5p [ms-pagos]

# =====================================================================
# BASE DE DATOS  (plantilla de DEC-01, igual que ms-eventos: solo cambia DB_NAME)
# =====================================================================
#   Desde Eclipse          -> localhost:5433  (el PostgreSQL de Docker)
#   Como contenedor (f.15) -> postgres:5432
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_pagos}
spring.datasource.username=${DB_USER:teleticket}
spring.datasource.password=${DB_PASSWORD:teleticket}

# JPA: las tablas las crea schema.sql; Hibernate solo valida. Ver ms-eventos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# =====================================================================
# RABBITMQ  (fase 11: consume reembolso.solicitado y publica pago.reembolsado)
# =====================================================================
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s

# Publisher confirms y returns: los exige PublicadorRabbitMQ (libs/mensajeria-comun).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Ack MANUAL: el listener confirma reembolso.solicitado solo cuando el reembolso ya esta guardado y
# anunciado. Si el servicio se cae antes, RabbitMQ devuelve el mensaje y se completa al volver.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
